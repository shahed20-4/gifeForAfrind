<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية لصديقي الغالي</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <div class="stars-container" id="starsContainer"></div>

    <div class="card" id="mainCard">
      
        <div class="time-greeting" id="timeGreeting">مساء الخير</div>
       
        <h1>
            هدية إلى 
            <span class="friend-name" id="friendName">اياد</span>
        </h1>
        
        <div class="subtitle" id="subtitle">
            مساحة آمنة لكل ما تشعر به، دون كلام ولا تفسير.
        </div>
               
        <div class="feelings-grid" id="feelingsGrid">
         
        </div>

        <div class="message-area" id="messageArea">
            <span class="empty-message">✨ اضغط على أي زر لتقرأ رسالة مخصصة ✨</span>
        </div>

        
        <div class="footer-note" id="footerNote">أنت لست وحدك أبداً</div>
    </div>
    <!-- زر الأذكار الجانبي -->
<button class="azkar-button" id="azkarButton" title="أذكار">أذكار</button>

<!-- النافذة المنبثقة -->
<div class="popup-overlay" id="azkarPopup">
    <div class="popup-content">
        <div class="popup-header">
            <h2>أذكار المسلم</h2>
            <button class="close-button" id="closePopup">✕</button>
        </div>
        
        <div class="azkar-container" id="azkarContainer">
            <!-- سيتم إضافة الأذكار هنا عبر JavaScript -->
        </div>
        
        <div style="text-align: center; margin-top: 20px; color: #8B7355; font-size: 0.8rem;">
            (اضغط على أي ذكر لتحديده)
        </div>
    </div>
</div>
<!-- زر الفضفضة الرئيسي -->
<button class="fadfada-button" id="fadfadaButton" title="فضفضة">💭</button>

<!-- نافذة كتابة فضفضة جديدة -->
<div class="fadfada-overlay" id="fadfadaOverlay">
    <div class="fadfada-content">
        <div class="fadfada-header">
            <h2>اكتب ما في قلبك</h2>
            <button class="close-fadfada" id="closeFadfada">✕</button>
        </div>
        
        <textarea class="fadfada-textarea" id="fadfadaText" placeholder="اكتب هنا... ما تشعر به، ما يفكر فيه، أي شيء تريد قوله..."></textarea>
        
        <button class="save-fadfada" id="saveFadfada">
            انتهيت من كتابه
        </button>
    </div>
</div>

<!-- صفحة المذكرات -->
<div class="journal-page" id="journalPage">
    <div class="journal-header">
        <button class="back-button" id="backFromJournal">←</button>
        <h1>📖 مذكراتي الصغيرة</h1>
        <div style="width: 50px;"></div> <!-- للمحاذاة -->
    </div>
    
    <div class="entries-container" id="entriesContainer">
        <!-- المذكرات تظهر هنا -->
    </div>
    
    <button class="add-entry-button" id="addEntryButton" title="فضفضة جديدة">+</button>
</div>

    <script src="script.js">
      

    </script>
</body>
</html>
